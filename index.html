                    "target": {
                        "namespace": "android_app",
                        "package_name": "com.fanwejay.taxi",
                        "sha256_cert_fingerprints": [
                            "89:5E:CA:42:3D:CC:47:6E:61:CB:D1:19:40:A3:6E:74:81:0E:CF:99:7D:9A:15:9D:01:46:02:A5:07:11:E6:C8"
                        ]
                    }
                }
            ], null, 2) + '</pre>';
        }
    </script>
</body>
</html>
